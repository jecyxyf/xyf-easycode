<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Software architecture</title>
  <style>:root {
  color-scheme: dark;
  --canvas: #f4f7fb;
  --panel: #202a39;
  --line: #3c4b60;
  --text: #e8eef5;
  --muted: #a7b6c9;
  --blue: #81b3e9;
  --teal: #6da89a;
  --node: #fcfdff;
  --node-header: #f4f7ff;
  --node-text: #17254d;
  --node-accent: #347cff;
  --node-icon: #347cff;
  --node-event-icon: #8547e9;
  font-family: "Segoe UI","Microsoft YaHei",sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--canvas)
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  overflow: hidden
}
button,input,textarea,select {
  font: inherit;
  color: inherit
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: #273447;
  border-radius: 5px;
  padding: 7px 11px;
  white-space: nowrap
}
button:hover {
  background: #34465e;
  border-color: #6d8aaa
}
button:disabled {
  opacity: .45;
  cursor: not-allowed
}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px
}
button.primary {
  background: #81b3e9;
  color: #142336;
  border-color: #81b3e9;
  font-weight: 600
}
button.danger-text {
  color: #efaaaa
}
input,textarea,select {
  width: 100%;
  min-width: 0;
  background: #17202e;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 8px
}
textarea {
  resize: vertical;
  min-height: 64px;
  line-height: 1.5
}
input[type=checkbox] {
  width: 16px;
  height: 16px;
  accent-color: var(--blue)
}
input[type=color] {
  height: 35px;
  padding: 3px
}
input[type=number] {
  appearance: textfield
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  color: var(--muted);
  font-size: 12px
}
.field input,.field textarea,.field select {
  font-size: 13px;
  color: var(--text)
}
[hidden] {
  display: none!important
}
.toolbar {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5
}
.project-heading {
  display: flex;
  flex: 1 1 0;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 2px 12px 2px 0;
  min-width: 0;
  border: 0;
  background: transparent
}
.project-heading:hover {
  background: #263449
}
.project-heading>span:nth-child(2) {
  flex: 1;
  min-width: 0
}
.project-heading strong {
  display: block;
  font-size: 17px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis
}
.project-heading small {
  display: block;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
  font-size: 11px
}
.brand-mark {
  flex-shrink: 0;
  font-size: 32px;
  color: var(--blue);
  line-height: 1
}
.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  flex-shrink: 0;
  justify-content: flex-end
}
.toolbar-separator {
  width: 1px;
  height: 24px;
  margin: 0 7px;
  flex-shrink: 0;
  background: var(--line)
}
#ec-viewport {
  position: absolute;
  inset: 56px 0 36px;
  overflow: hidden;
  background-color: var(--canvas);
  background-image: radial-gradient(circle,#cad7eb var(--grid-dot-radius,1px),transparent var(--grid-dot-radius,1px));
  background-size: 20px 20px;
  background-position: -10px -10px;
  touch-action: none
}
#ec-world {
  position: absolute;
  transform-origin: 0 0;
  width: 0;
  height: 0
}
#ec-groups,#ec-nodes {
  position: absolute;
  inset: 0;
  width: 0;
  height: 0
}
#ec-edges {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  overflow: visible;
  pointer-events: none
}
.module-node {
  position: absolute;
  width: 480px;
  padding: 0;
  color: var(--node-text);
  border: 2px solid color-mix(in srgb,var(--node-accent) 22%,var(--node));
  border-radius: 17px;
  background: transparent;
  box-shadow: 0 12px 32px #315b8b25,0 0 0 3px #ffffff80;
  overflow: visible;
  isolation: isolate;
}
.module-node.selected,.module-node:focus-visible {
  border-color: var(--node-accent);
  outline: none;
  box-shadow: 0 0 0 1px #347cff21,0 0 0 4px #347cff0b,0 9px 28px #347cff38;
}
.module-shell {
  position: relative;
  background: var(--node);
  border-radius: 15px;
  overflow: hidden;
}
.module-node,.module-preview {
  color-scheme: light;
  --text: var(--node-text);
  --node-secondary: color-mix(in srgb,var(--node-text) 70%,var(--node));
  --node-rule: color-mix(in srgb,var(--node-icon) 12%,var(--node));
}
.module-header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 82px;
  padding: 18px 20px;
  background: var(--node-header);
  border-bottom: 1px solid var(--node-rule);
  cursor: grab;
  touch-action: none;
}
.node-emblem {display: grid; place-items: center; flex: 0 0 46px; height: 46px; border-radius: 10px; background: color-mix(in srgb,var(--node-icon) 15%,var(--node)); color: var(--node-icon)}
.node-emblem .icon {width: 28px; height: 28px; fill: currentColor; stroke-width: .8}
.module-heading {flex: 1; min-width: 0}
.module-header h2 {margin: 0; min-width: 0; font-size: 24px; font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.5px}
.module-language {display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: color-mix(in srgb,var(--node-text) 52%,var(--node)); font-size: 12px; line-height: 1.3; font-weight: 500; letter-spacing: .2px}
.module-header-actions {display: flex; align-items: center; gap: 9px; flex-shrink: 0}
.module-header button {border: 0; padding: 3px; background: var(--node); color: var(--node-text); border-radius: 5px}
.module-header button:hover {background: var(--node); color: var(--node-text)}
.module-header button:focus-visible {outline-color: var(--node-accent)}
.module-header button .icon {width: 19px; height: 19px; color: var(--node-text)}
.module-more {display: grid; place-items: center; width: 28px; height: 28px}
.module-more .icon {stroke-width: 3}
.module-content {display: grid; gap: 17px; padding: 10px 15px 14px; color: var(--node-secondary); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere}
.module-content:empty {display: none}
.module-group {min-width: 0}
.module-group-heading {display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 1px 6px}
.module-group-title {display: flex; align-items: center; gap: 12px; margin: 0; min-width: 0; color: var(--node-text); font-size: 16px; font-weight: 700; line-height: 1.4}
.module-group-symbol {display: grid; place-items: center; flex: 0 0 30px; height: 30px; border-radius: 8px; background: color-mix(in srgb,var(--node-icon) 14%,var(--node))}
.module-group-symbol .icon {width: 19px; height: 19px; color: var(--node-icon)}
.module-group[data-module-group=events] .module-group-symbol {background: color-mix(in srgb,var(--node-event-icon) 13%,var(--node))}
.module-group[data-module-group=events] .icon {color: var(--node-event-icon); fill: currentColor; stroke-width: 1}
.module-group > .module-group-content {min-width: 0; margin: 0; border: 1px solid var(--node-rule); border-radius: 10px; background: color-mix(in srgb,var(--node-header) 38%,var(--node)); box-shadow: inset 0 1px 0 #ffffff4d}
.module-purpose {margin: 0; padding: 13px 16px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden}
.module-properties {display: grid; gap: 4px; margin: 0; padding: 10px 16px; font-size: 11px}
.module-purpose + .module-properties {padding-top: 0}
.module-property {display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 8px; align-items: baseline}
.module-property dt {color: var(--node-text)}
.module-property dd {margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis}
.module-code-location {font: 11px/1.8 Consolas,"Cascadia Code",monospace}
.module-requirements {display: grid; gap: 0; padding: 0 14px; list-style: none}
.module-requirements li {padding: 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis}
.module-requirements li + li {border-top: 1px solid var(--node-rule)}
.module-member-list {display: grid; gap: 0; padding: 0 9px}
.module-member-row {--row-tone: var(--node-icon); position: relative; display: grid; grid-template-columns: 44px minmax(65px,24%) minmax(0,1fr) 16px; gap: 9px; align-items: center; min-height: 37px; padding: 2px 0}
.module-member-row + .module-member-row {border-top: 1px solid var(--node-rule)}
.module-member-name {grid-column: 2; grid-row: 1; margin: 0; min-width: 0; color: var(--node-text); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis}
.module-member-description {grid-column: 3; grid-row: 1; position: relative; margin: 0; min-width: 0; padding: 5px 0 5px 17px; color: var(--node-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis}
.module-member-description::before {content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 18px; transform: translateY(-50%); background: color-mix(in srgb,var(--node-icon) 20%,var(--node))}
.module-type-label {grid-column: 1; grid-row: 1; justify-self: start; max-width: 44px; margin: 0; padding: 4px 9px; border: 0; border-radius: 9px; color: var(--row-tone); background: color-mix(in srgb,var(--row-tone) 12%,var(--node)); font-size: 11px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis}
[data-value-kind=string] {--row-tone: #347cff}
[data-value-kind=number] {--row-tone: #009c59}
[data-value-kind=boolean] {--row-tone: #d67c00}
[data-value-kind=array] {--row-tone: #0e9bab}
[data-value-kind=object] {--row-tone: #8142e7}
[data-value-kind=other] {--row-tone: #71809e}
[data-value-kind=emit] {--row-tone: #9148f4}
[data-value-kind=receive] {--row-tone: #f5a300}
.module-event-dot {grid-column: 1; grid-row: 1; width: 9px; height: 9px; margin-left: 7px; border-radius: 50%; background: var(--row-tone); box-shadow: inset 0 1px 1px #ffffff4d}
.module-method-symbol {grid-column: 1; grid-row: 1; display: grid; place-items: center; width: 24px; height: 24px; color: var(--node-text)}
.module-row-more {grid-column: 4; grid-row: 1; color: var(--node-text); background: var(--node); font-size: 17px; line-height: 1; letter-spacing: 1px; text-align: right; user-select: none}
[data-node-preview] {cursor: pointer; border-radius: 5px}
[data-node-preview]:hover,[data-node-preview].is-previewing {background: color-mix(in srgb,var(--node-icon) 6%,var(--node))}
[data-node-preview]:focus-visible {outline: 2px solid var(--node-icon); outline-offset: 2px}
.module-port {position: absolute; z-index: 3; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; transform: translate(-50%,-50%); cursor: crosshair; touch-action: none}
.module-port::after {content: ''; position: absolute; inset: 6px; border: 2px solid white; border-radius: 50%; background: var(--node-accent); box-shadow: 0 0 0 1px var(--node-accent),0 0 9px #347cff4d}
.module-port:hover,.module-port:focus-visible {background: #347cff18}
.module-port:hover::after,.module-port:focus-visible::after,.connecting .module-port::after {box-shadow: 0 0 0 2px var(--node-accent),0 0 14px #347cff66}
.module-port.port-source::after {background: #e8bb82; border-color: #ffe2b9; box-shadow: 0 0 0 4px #e8bb8240}
.module-port.port-target::after {background: #82d3b9; border-color: #b7f5df; box-shadow: 0 0 0 4px #82d3b940}
.port-top {left: 50%; top: -1px}
.port-right {left: calc(100% + 1px); top: 50%}
.port-bottom {left: 50%; top: calc(100% + 1px)}
.port-left {left: -1px; top: 50%}
.toolbar button[aria-pressed=true] {
  border-color: var(--blue);
  background: #344b65
}
.connection-hint {
  position: absolute;
  z-index: 3;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 9px 14px;
  border: 1px solid #6d8aaa;
  border-radius: 6px;
  color: #d8eaff;
  background: #203047ed;
  pointer-events: none;
  font-size: 12px;
  line-height: 1.6
}
.module-preview {
  position: fixed;
  z-index: 8;
  width: 360px;
  padding: 18px;
  border: 1px solid var(--node-rule);
  border-radius: 12px;
  background: var(--node);
  color: var(--node-text);
  box-shadow: 0 12px 36px #315da429;
  overflow: auto;
  overscroll-behavior: contain;
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.7;
}
.module-preview-title {margin: 0; font-size: 15px; line-height: 1.5; font-weight: 600; white-space: pre-wrap}
.module-preview-heading {display: flex; align-items: baseline; gap: 10px}
.module-preview-heading .module-preview-title {flex: 1; min-width: 0}
.module-preview-direction {flex: none; padding: 2px 8px; border: 1px solid var(--node-rule); border-radius: 5px; background: var(--node-header); color: var(--node-text); font-size: 11px; line-height: 1.5; white-space: nowrap}
.module-preview-description {margin: 10px 0 0; color: var(--node-secondary); white-space: pre-wrap}
.module-preview-io {margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--node-rule)}
.module-preview-io-title {margin: 0; color: var(--node-text); font-size: 13px; line-height: 1.5; font-weight: 600}
.module-preview-empty {margin: 8px 0 0; color: var(--node-secondary); font-size: 12px}
.module-preview-parameters {display: grid; gap: 10px; margin: 10px 0 0; font-size: 12px}
.module-preview-parameter dt,.module-preview-parameter dd {min-width: 0; margin: 0; overflow-wrap: anywhere}
.module-preview-parameter dt {display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; color: var(--node-text)}
.module-preview-parameter dd {margin-top: 4px; color: var(--node-secondary); white-space: pre-wrap}
.module-preview-parameter-name {min-width: 0; font-weight: 500}
.module-preview-type {max-width: 100%; padding: 1px 6px; border-radius: 4px; background: var(--node-header); color: var(--node-secondary); font: 11px/1.7 Consolas,"Cascadia Code",monospace; white-space: pre-wrap; overflow-wrap: anywhere}
.module-appearance-fields {grid-template-columns: repeat(3,minmax(0,1fr))}
.color-value {font-size: 11px; font-variant-numeric: tabular-nums}
.editor-section {
  display: grid;
  gap: 10px
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0;
  font-size: 13px;
  font-weight: 600
}
.section-heading button {
  font-size: 12px;
  padding: 4px 7px
}
.parameter-list {
  display: grid;
  gap: 7px
}
.parameter-row,.source-row {
  padding: 9px;
  background: #192331;
  border: 1px solid #344255;
  border-radius: 4px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px
}
.parameter-row .wide,.source-row .wide {
  grid-column: 1/-1
}
.row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px
}
.row-bottom button {
  padding: 3px 7px;
  font-size: 11px
}
.check-label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px
}
.empty-note {
  color: var(--muted);
  font-size: 12px;
  margin: 0;
  line-height: 1.6
}
.group-frame {
  --group-text: #ffffff;
  position: absolute;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(129,179,233,0.5);
  pointer-events: none
}
.group-header {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 14px;
  color: var(--text);
  pointer-events: auto;
  cursor: grab;
  touch-action: none
}
.group-header .group-title {
  flex: 1;
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
.group-header button,.group-header button:hover {
  background: transparent;
  color: var(--group-text,var(--text));
  border-color: transparent
}
.group-header button .icon {stroke-width: 3}
.group-empty {
  position: absolute;
  left: 20px;
  top: 61px;
  font-size: 12px;
  color: var(--muted)
}
.relation-line {
  fill: none;
  stroke: #87a8ce;
  stroke-width: 2;
  pointer-events: none
}
.relation-preview {
  fill: none;
  stroke: #e8bb82;
  stroke-width: 2;
  stroke-dasharray: 6 4;
  pointer-events: none
}
.relation-preview.has-target {
  stroke: #82d3b9
}
.relation-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 18;
  pointer-events: stroke;
  cursor: pointer
}
.relation-group {--label-color: #ffffff; --label-background: rgba(129,179,233,0.5)}
.relation-label-background {fill: var(--label-background); pointer-events: all; cursor: pointer}
.relation-label {
  fill: var(--label-color);
  stroke: none;
  font-size: 12px;
  pointer-events: auto;
  cursor: pointer
}
.relation-group,.relation-group:focus,.relation-group:focus-visible {
  outline: none
}
.relation-group:focus-visible .relation-line,.relation-group:hover .relation-line {
  stroke: var(--blue);
  stroke-width: 3
}
.relation-group.selected .relation-line {
  stroke: #ff9f43;
  stroke-width: 3;
  marker-end: url(#ec-arrow-selected)
}
.relation-label.is-empty,.relation-label-background.is-empty {opacity: 0; pointer-events: none}
.relation-actions {
  position: absolute;
  z-index: 3;
  display: flex;
  gap: 6px
}
.relation-actions[hidden] {display: none}
.relation-actions button {
  width: 32px;
  height: 32px;
  padding: 6px;
  color: var(--text);
  background: var(--panel);
  border-color: #62616a;
  box-shadow: 0 2px 6px #0004
}
.relation-actions button:hover,.relation-actions button:focus-visible {
  color: #ff9f43;
  border-color: #ff9f43;
  background: #34303a
}
.annotation-editor {
  --annotation-color: var(--text);
  --annotation-background: var(--panel);
  color: var(--annotation-color);
  position: absolute;
  z-index: 4;
  width: min(360px,calc(100% - 16px));
  padding: 8px;
  border: 1px solid var(--blue);
  border-radius: 6px;
  background: var(--annotation-background);
  box-shadow: 0 5px 16px #0005
}
.annotation-editor textarea {
  color: inherit;
  background: transparent;
  display: block;
  min-height: 42px;
  resize: none
}
.annotation-editor small {
  opacity: .85;
  display: block;
  margin-top: 6px;
  color: inherit;
  font-size: 11px
}
.annotation-error {margin: 6px 0 0; color: #efaaaa; font-size: 12px}
.annotation-error:empty {display: none}
.statusbar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 36px;
  border-top: 1px solid var(--line);
  background: #1c2533;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  z-index: 5
}
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 4px
}
.zoom-controls button {
  padding: 4px 9px;
  border-color: transparent;
  background: transparent
}
.zoom-controls output {
  font-size: 12px;
  color: var(--muted);
  width: 43px;
  text-align: center
}
#ec-feedback {
  position: absolute;
  right: 20px;
  top: 82px;
  z-index: 10;
  max-width: 480px;
  max-height: calc(100vh - 150px);
  overflow: auto;
  display: grid;
  gap: 8px
}
#ec-notice,#ec-warnings {
  padding: 12px 16px;
  background: #3c2d31;
  border: 1px solid #87585f;
  color: #f0c4c4;
  border-radius: 6px;
  white-space: pre-wrap;
  font-size: 12px
}
#ec-warnings {
  position: relative;
  padding-right: 46px;
  background: #332e22;
  border-color: #887449;
  color: #e8d4a6;
  max-height: 28vh;
  overflow: auto
}
#ec-warning-close {position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; padding: 5px; background: transparent; border: 0; color: inherit}
#ec-empty {
  position: absolute;
  top: 42%;
  left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  color: var(--muted);
  font-size: 16px
}
#ec-empty button {
  display: block;
  margin: 16px auto 0
}
dialog {
  position: fixed;
  inset: 0;
  margin: auto;
  max-height: calc(100vh - 32px);
  color: var(--text);
  background: var(--panel);
  border: 1px solid #52647d;
  border-radius: 10px;
  padding: 24px;
  width: min(460px,calc(100vw - 32px));
  box-shadow: 0 24px 80px #0008
}
dialog::backdrop {
  background: #090f1bb3
}
.confirmation-dialog {width: min(420px,calc(100vw - 32px)); overflow: auto}
.confirmation-dialog h2 {margin: 0 0 16px; font-size: 19px}
.confirmation-dialog p {margin: 0; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted)}
.confirmation-dialog .dialog-actions {margin-top: 24px; justify-content: flex-end}
.confirmation-dialog .dialog-actions button {min-width: 80px}
.confirm-danger {background: #973c35; border-color: #bb554c; color: #fff}
.confirm-danger:hover {background: #ad473e; border-color: #db7267}
.confirm-primary {background: #294f78; border-color: #638db9; color: #fff}
dialog form {
  display: grid;
  gap: 17px
}
.dialog-body {
  display: grid;
  gap: 17px;
  min-width: 0
}
dialog.module-dialog {
  width: min(900px,calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  padding: 0;
  overflow: hidden
}
.module-dialog form {
  max-height: calc(100vh - 34px);
  grid-template-rows: auto minmax(0,1fr) auto auto;
  gap: 0
}
.module-dialog h2 {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line)
}
.module-dialog-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-height: 1.4
}
.module-dialog-language {
  flex: 0 0 auto;
  max-width: 35%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
  line-height: 1.4
}
.field-note {font-size: 11px; line-height: 1.5; color: var(--muted)}
.module-dialog .dialog-body {
  padding: 20px 24px;
  min-height: 0;
  overflow: auto;
  align-content: start;
  scrollbar-gutter: stable;
  overflow-anchor: none;
  overscroll-behavior: contain
}
.module-editor,.member-list {
  display: grid;
  gap: 10px;
  min-width: 0
}
.editor-fold {
  min-width: 0;
  background: #1c2533;
  border: 1px solid var(--line);
  border-radius: 6px
}
.fold-heading {display: flex; align-items: center; gap: 6px; padding-right: 8px}
.fold-toggle {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border: 0;
  background: transparent;
  text-align: left;
  white-space: normal
}
.fold-icon {display: flex; flex-shrink: 0}
.fold-title {flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.5}
.fold-count {color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums}
.fold-count:empty {display: none}
.fold-body {display: grid; gap: 12px; padding: 14px; border-top: 1px solid var(--line); min-width: 0}
.member-editor {background: #192331}
.member-editor .fold-toggle {font-size: 12px}
.requirement-list {display: grid; gap: 10px; min-width: 0}
.requirement-row {display: grid; grid-template-columns: minmax(0,1fr) 36px; align-items: start; gap: 8px}
.requirement-row textarea {min-width: 0; min-height: 60px; resize: vertical}
.flow-step-list {display: grid; gap: 8px; min-width: 0}
.flow-step-row {display: grid; grid-template-columns: 24px minmax(0,1fr) 36px; gap: 8px; align-items: center; min-width: 0}
.flow-step-index {color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums}
.flow-step-row input {min-width: 0}
.structure-fields,.structure-field-list {display: grid; gap: 12px; min-width: 0}
.structure-fields-heading {display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted)}
.structure-field-row {display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.4fr) 36px; gap: 8px; align-items: start; min-width: 0}
.structure-field-row .field {min-width: 0}
.structure-field-row > .member-delete {margin-top: 23px}
@media (max-width: 700px) {
  .structure-field-row {grid-template-columns: minmax(0,1fr) minmax(0,1fr); padding-bottom: 12px; border-bottom: 1px solid var(--line)}
  .structure-field-row:last-child {padding-bottom: 0; border-bottom: 0}
  .structure-field-row > .member-delete {grid-column: 2; justify-self: end; margin-top: 0}
}
.bilingual-fields,.parameter-value-fields {display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px}
.bilingual-fields input,.parameter-value-fields input,.parameter-value-fields .field {min-width: 0}
.translation-field {min-width: 0}
.translation-control {position: relative; display: flex; min-width: 0}
.translation-control input {width: 100%; padding-right: 38px}
.translation-control .icon-button {position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; padding: 5px; border: 0; background: transparent}
.translation-control .icon-button:disabled {opacity: .45; cursor: wait}
.translation-message {font-size: 11px; line-height: 1.5; overflow-wrap: anywhere}
.translation-message:empty {display: none}
.directory-control {display: flex; gap: 6px; min-width: 0}
.directory-control input {flex: 1; min-width: 0}
.directory-control button {flex-shrink: 0}
.directory-note,.directory-status {font-size: 11px; line-height: 1.5; overflow-wrap: anywhere}
.directory-status:empty {display: none}
.module-editor .empty-note {margin: 0}
.group-add,.member-delete {flex-shrink: 0}
.group-add:hover {border-color: var(--blue)}
.module-dialog .dialog-actions {
  padding: 14px 24px;
  border-top: 1px solid var(--line)
}
.module-dialog .dialog-error:not(:empty) {
  padding: 12px 24px
}
.module-dialog .field {
  min-width: 0
}
@media(max-width:560px) {
  .module-dialog h2,.module-dialog .dialog-body,.module-dialog .dialog-actions {
    padding: 14px
  }
  .module-dialog .parameter-row,.module-dialog .source-row {
    grid-template-columns: 1fr
  }
}
dialog h2 {
  margin: 0;
  font-size: 19px
}
dialog .dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 7px
}
dialog .dialog-actions .dialog-delete {
  margin-right: auto
}
.dialog-error {
  margin: 0;
  color: #efaaaa;
  font-size: 12px;
  white-space: pre-wrap
}
.dialog-note {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6
}
button.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  padding: 6px;
  line-height: 1
}
.icon {
  display: block;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  pointer-events: none
}
.toolbar .icon-button,dialog .icon-button {
  width: 36px;
  height: 36px
}
#ec-empty .icon-button {
  display: flex
}
@media(max-width:1000px) {
  .toolbar {
    gap: 10px;
    padding: 10px
  }
  .toolbar-actions {
    gap: 4px
  }
  .toolbar-actions button {
    padding-left: 8px;
    padding-right: 8px
  }
  .toolbar-separator {
    margin: 0 4px
  }
}
@media(max-width:700px) {
  .toolbar {
    height: 96px;
    flex-wrap: wrap;
    gap: 8px
  }
  .project-heading {
    max-width: 100%;
    min-width: 0;
    flex: 1 1 100%
  }
  .toolbar-actions {
    width: 100%
  }
  #ec-viewport {
    top: 96px
  }
  .statusbar {
    gap: 4px;
    padding: 0 6px
  }
  #ec-feedback {
    top: 106px;
    left: 12px;
    right: 12px
  }
}

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .module-preview {background: color-mix(in srgb,var(--node) 86%,transparent); backdrop-filter: blur(22px) saturate(115%); -webkit-backdrop-filter: blur(22px) saturate(115%)}

}

.open-project {position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--canvas); color:var(--node-text)}
.open-project h1 {font-size:26px; margin:0 0 14px}
.open-project p {font-size:15px; line-height:1.9; margin:0 0 22px}
.open-project small {margin-top:18px; color:#52637d}
#ec-file-status {min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 12px; font-size:12px}

  <header class="toolbar">

    </nav>
  </header>
  <main id="ec-viewport" aria-label="Module editing canvas" tabindex="0">
    <div id="ec-world"><div id="ec-groups"></div><svg id="ec-edges" aria-label="Module relations"></svg><div id="ec-nodes"></div></div>
    <div id="ec-connection-hint" class="connection-hint" role="status" aria-live="polite" hidden></div>

  </footer>
  <aside id="ec-feedback" aria-label="Project notices"><div id="ec-notice" role="alert" hidden></div><div id="ec-warnings" role="status" aria-live="polite" hidden><span id="ec-warning-text"></span><button id="ec-warning-close" type="button" data-icon="close" aria-label="Dismiss incomplete-item notice" title="Dismiss incomplete-item notice"></button></div></aside>

    <button type="button" class="module-port port-top" data-port="top" aria-label="Top connection" title="Top connection: drag this dot to a dot on another module"></button>
